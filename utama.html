<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">



<style>

body{
    margin:0;
    background:#f5f6fa;
}



/* NAVBAR */

.navbar{

    height:60px;
    background:#0d6efd;
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;

}

/* SIDEBAR */
.sidebar{
    position:fixed;
    top:0;
    left:0;
    width:250px;
    height:100vh;
    background:#212529;
    padding-top:70px;
    transition:.3s;
}

.sidebar.collapsed{

    width:70px;

}



.sidebar .menu-text{

    margin-left:10px;

}



.sidebar.collapsed .menu-text{

    display:none;

}



.sidebar .nav-link{

    color:#ddd;

    padding:12px 20px;

    display:flex;

    align-items:center;

    gap:10px;

}



.sidebar .nav-link:hover{

    background:#0d6efd;

    color:white;

}




/* MAIN */


.main{

    margin-left:250px;

    padding:80px 20px 60px;

    transition:.3s;

}



.main.expand{

    margin-left:70px;

}




/* FOOTER */


.footer{

    position:fixed;

    bottom:0;

    left:250px;

    right:0;

    background:white;

    text-align:center;

    padding:10px;

    transition:.3s;

}



.footer.expand{

    left:70px;

}



</style>


</head>


<body>



<!-- CEK LOGIN -->

<script>


if(sessionStorage.getItem("login")!=="true"){

    window.location.href="login.html";

}


</script>





<!-- NAVBAR -->


<nav class="navbar navbar-dark shadow">


<div class="container-fluid">


<button class="btn text-white fs-4"
id="toggleSidebar">

<i class="bi bi-list"></i>

</button>




<span class="navbar-brand fw-bold">

<i class="bi bi-speedometer2"></i>

Dashboard

</span>





<div class="dropdown ms-auto">


<a class="text-white text-decoration-none dropdown-toggle"
href="#"
data-bs-toggle="dropdown">


<i class="bi bi-person-circle fs-4"></i>


<span id="namaUser">
User
</span>


</a>



<ul class="dropdown-menu dropdown-menu-end">


<li>

<a class="dropdown-item">

<i class="bi bi-person"></i>

Profil

</a>

</li>


<li>

<hr>

</li>


<li>


<a href="#"
class="dropdown-item text-danger"
id="logoutBtn">


<i class="bi bi-box-arrow-right"></i>

Logout


</a>


</li>


</ul>



</div>


</div>


</nav>







<!-- SIDEBAR -->


<div class="sidebar"
id="sidebar">



<ul class="nav flex-column">


<li class="nav-item">

<a class="nav-link active">

<i class="bi bi-house"></i>

<span class="menu-text">

Dashboard

</span>

</a>

</li>





<li class="nav-item menu-admin">

<a class="nav-link"
href="master-user.html">


<i class="bi bi-people"></i>

<span class="menu-text">

Master User

</span>


</a>


</li>

<!-- Master Karyawan -->
        <li class="nav-item menu-admin">

            <a
                href="master-karyawan.html"
                class="nav-link active"
                data-bs-toggle="tooltip"
                data-bs-placement="right"
                title="Master Karyawan"
            >
                <i class="bi bi-people"></i>
                <span>Karyawan</span>
            </a>

        </li>




<li class="nav-item">

<a class="nav-link">

<i class="bi bi-box"></i>

<span class="menu-text">

Barang

</span>


</a>

</li>






<li class="nav-item">

<a class="nav-link">

<i class="bi bi-gear"></i>

<span class="menu-text">

Setting

</span>


</a>

</li>


</ul>


</div>









<!-- MAIN -->


<div class="main"
id="main">



<h3>

Selamat Datang,
<span id="welcome">

</span>

</h3>



<div class="row mt-4">



<div class="col-md-3">


<div class="card shadow-sm">


<div class="card-body">


<h6>

<i class="bi bi-people"></i>

Total User

</h6>


<h2 id="jumlahUser">

0

</h2>


</div>


</div>


</div>



</div>



</div>







<footer class="footer"
id="footer">


Dashboard System © 2026


</footer>









<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



<script>


// USER LOGIN


let nama =
sessionStorage.getItem("nama");


let level =
sessionStorage.getItem("level");



document.getElementById("namaUser").innerHTML =
nama;


document.getElementById("welcome").innerHTML =
nama;





// HAK AKSES


if(level==="Operator"){


document.querySelectorAll(".menu-admin")
.forEach(function(menu){


menu.style.display="none";


});


}






// TOTAL USER


let akun =
JSON.parse(
localStorage.getItem("dataUser")
) || [];



document.getElementById("jumlahUser")
.innerHTML =
akun.length;







// TOGGLE SIDEBAR


const sidebar =
document.getElementById("sidebar");


const main =
document.getElementById("main");


const footer =
document.getElementById("footer");


const toggle =
document.getElementById("toggleSidebar");





toggle.onclick=function(){


sidebar.classList.toggle("collapsed");


main.classList.toggle("expand");


footer.classList.toggle("expand");



};







// LOGOUT


document.getElementById("logoutBtn")
.onclick=function(e){


e.preventDefault();



sessionStorage.clear();



window.location.href="login.html";



};




</script>


</body>

</html>
