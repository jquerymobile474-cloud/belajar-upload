<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Master User</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">


<style>

body{
    background:#f5f6fa;
    padding-top:70px;
}

/* navbar */
.navbar{
    height:60px;
}

/* card */
.card{
    border:none;
    border-radius:15px;
}

/* tabel */
.table{
    vertical-align:middle;
}

</style>
</head>


<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-primary fixed-top shadow">


<div class="container-fluid">


<a class="navbar-brand fw-bold">

<i class="bi bi-people"></i>

Master User

</a>




<div class="dropdown">


<a href="#"
class="text-white text-decoration-none dropdown-toggle"
data-bs-toggle="dropdown">


<i class="bi bi-person-circle fs-4"></i>


<span id="namaLogin">

User

</span>


</a>




<ul class="dropdown-menu dropdown-menu-end">


<li>

<a href="#"
class="dropdown-item text-danger"
id="logoutBtn">


<i class="bi bi-box-arrow-right"></i>

Logout


</a>

</li>


</ul>


</div>


</div>


</nav>








<div class="container-fluid">



<div class="card shadow-sm">


<div class="card-body">



<div class="d-flex justify-content-between align-items-center mb-3">


<h4>

<i class="bi bi-person-lines-fill"></i>

Data User

</h4>



<button class="btn btn-primary"
data-bs-toggle="modal"
data-bs-target="#modalUser"
id="btnTambah">


<i class="bi bi-plus-circle"></i>

Tambah User

</button>



</div>







<table class="table table-bordered table-hover">


<thead class="table-primary">


<tr>


<th width="50">
No
</th>


<th>
Nama
</th>


<th>
Username
</th>


<th>
Password
</th>


<th>
Level
</th>


<th width="120">
Aksi
</th>


</tr>


</thead>



<tbody id="tabelUser">


</tbody>



</table>




</div>


</div>


</div>









<!-- MODAL FORM USER -->


<div class="modal fade"
id="modalUser">


<div class="modal-dialog">


<div class="modal-content">



<div class="modal-header">


<h5 class="modal-title">

Form User

</h5>


<button class="btn-close"
data-bs-dismiss="modal">

</button>


</div>





<div class="modal-body">


<input type="hidden"
id="idEdit">





<div class="mb-3">


<label class="form-label">

Nama

</label>


<input type="text"
class="form-control"
id="nama">


</div>





<div class="mb-3">


<label class="form-label">

Username

</label>


<input type="text"
class="form-control"
id="username">


</div>





<div class="mb-3">


<label class="form-label">

Password

</label>


<input type="text"
class="form-control"
id="password">


</div>





<div class="mb-3">


<label class="form-label">

Level

</label>


<select class="form-select"
id="level">


<option value="Admin">

Admin

</option>


<option value="Operator">

Operator

</option>

<option value="User">

User

</option>


</select>


</div>



</div>








<div class="modal-footer">


<button class="btn btn-secondary"
data-bs-dismiss="modal">

Tutup

</button>



<button class="btn btn-primary"
id="btnSimpan">

Simpan

</button>



</div>



</div>


</div>


</div>







<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>


// ==================================
// CEK LOGIN
// ==================================

if(sessionStorage.getItem("login") !== "true"){

    window.location.href="login.html";

}



// ==================================
// CEK LEVEL ADMIN
// ==================================

let levelLogin = sessionStorage.getItem("level");


if(levelLogin !== "Admin"){


    alert("Anda tidak memiliki akses halaman ini");


    window.location.href="utama.html";


}





// ==================================
// TAMPIL NAMA LOGIN
// ==================================

document.getElementById("namaLogin").innerHTML =
sessionStorage.getItem("nama");





// ==================================
// AMBIL DATA USER
// ==================================

let dataUser = JSON.parse(
    localStorage.getItem("dataUser")
) || [];



tampilUser();







// ==================================
// TAMPIL DATA KE TABEL
// ==================================

function tampilUser(){


let isi = "";



dataUser.forEach(function(data,index){


isi += `

<tr>


<td>${index+1}</td>


<td>${data.nama}</td>


<td>${data.username}</td>


<td>

${data.password}

</td>


<td>

<span class="badge bg-${data.level==="Admin"?"primary":"success"}">

${data.level}

</span>

</td>



<td>


<button class="btn btn-warning btn-sm"
onclick="editUser(${index})">


<i class="bi bi-pencil"></i>


</button>



<button class="btn btn-danger btn-sm"
onclick="hapusUser(${index})">


<i class="bi bi-trash"></i>


</button>



</td>



</tr>

`;


});



document.getElementById("tabelUser").innerHTML=isi;


}








// ==================================
// TAMBAH USER
// ==================================

document.getElementById("btnTambah")
.onclick=function(){


document.getElementById("idEdit").value="";

document.getElementById("nama").value="";

document.getElementById("username").value="";

document.getElementById("password").value="";

document.getElementById("level").value="Pilih";


};








// ==================================
// SIMPAN USER
// ==================================

document.getElementById("btnSimpan")
.onclick=function(){



let id =
document.getElementById("idEdit").value;



let userBaru = {


nama:
document.getElementById("nama").value,


username:
document.getElementById("username").value,


password:
document.getElementById("password").value,


level:
document.getElementById("level").value


};





// validasi

if(
userBaru.nama==="" ||
userBaru.username==="" ||
userBaru.password===""
){

alert("Data user belum lengkap");

return;

}







if(id===""){


    // tambah

    dataUser.push(userBaru);


}else{


    // edit

    dataUser[id]=userBaru;


}






localStorage.setItem(
"dataUser",
JSON.stringify(dataUser)
);





tampilUser();





bootstrap.Modal
.getInstance(
document.getElementById("modalUser")
)
.hide();



};









// ==================================
// EDIT USER
// ==================================

function editUser(index){



let data=dataUser[index];



document.getElementById("idEdit").value=index;


document.getElementById("nama").value=
data.nama;


document.getElementById("username").value=
data.username;


document.getElementById("password").value=
data.password;


document.getElementById("level").value=
data.level;





let modal =
new bootstrap.Modal(
document.getElementById("modalUser")
);


modal.show();



}









// ==================================
// HAPUS USER
// ==================================

function hapusUser(index){



if(confirm("Hapus user ini?")){


dataUser.splice(index,1);



localStorage.setItem(
"dataUser",
JSON.stringify(dataUser)
);



tampilUser();



}



}







// ==================================
// LOGOUT
// ==================================

document.getElementById("logoutBtn")
.onclick=function(e){


e.preventDefault();



sessionStorage.clear();



window.location.href="login.html";



};



</script>


</body>

</html>
